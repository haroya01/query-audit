name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing published release tag to retry, for example v0.6.0.
          The selected workflow branch does not select the artifact source.
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - name: Check out release validation tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: release-tools
          persist-credentials: false

      - name: Resolve published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RETRY_TAG: ${{ inputs.release_tag }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          CREATED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          python3 release-tools/.github/scripts/validate_release.py resolve \
            --repository "$GITHUB_REPOSITORY" --event "$RELEASE_EVENT" \
            --retry-tag "$RETRY_TAG" --created-tag "$CREATED_TAG" \
            --created-version "$CREATED_VERSION"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: release-source
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        run: ./gradlew build test
        working-directory: release-source

      - name: Validate release source before publication
        id: validate
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 release-tools/.github/scripts/validate_release.py validate \
            --source release-source --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: Publish to Maven Central
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        working-directory: release-source
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Summary
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          printf '%s\n' \
            "## Release ${VERSION}" \
            "" \
            "Source: ${RELEASE_TAG} (${RELEASE_COMMIT})" \
            "" \
            "Published to Maven Central:" \
            '```' \
            "io.github.haroya01:query-audit-core:${VERSION}" \
            "io.github.haroya01:query-audit-junit5:${VERSION}" \
            "io.github.haroya01:query-audit-mysql:${VERSION}" \
            "io.github.haroya01:query-audit-postgresql:${VERSION}" \
            "io.github.haroya01:query-audit-spring-boot-starter:${VERSION}" \
            '```' >> "$GITHUB_STEP_SUMMARY"
