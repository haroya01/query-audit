site_name: QueryAudit
site_url: https://haroya01.github.io/query-audit
site_description: Find N+1 queries at their call site, lock fixed query counts in contracts, and gate pull requests for JUnit 5 tests
site_author: QueryAudit Contributors
repo_url: https://github.com/haroya01/query-audit
repo_name: haroya01/query-audit
edit_uri: edit/main/docs/

# Theme templates are rendered by Material, not served as standalone pages.
exclude_docs: |
  /overrides/
  /hooks/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          site_description: JUnit 5 테스트에서 N+1 쿼리를 호출 위치로 찾고, 고친 쿼리 수를 계약으로 고정하고, PR을 게이트해요
          nav_translations:
            Home: 홈
            Start Here: 시작하기
            Install in Your Project: 프로젝트에 설치
            Spring Boot Setup: Spring Boot 설정
            Run the Example: 예제 실행
            Guides: 가이드
            Find an N+1: N+1 찾기
            How N+1 Detection Works: N+1 탐지 방식
            Lock the Fix: 고친 경로 고정
            Lock a Fixed Path: 고친 경로 고정하기
            Query Contracts: 쿼리 계약
            Gate the Pull Request: PR 게이트
            Your First CI Check: 첫 CI 체크
            Reference: 레퍼런스
            Extend and Contribute: 확장과 기여
  - minify:
      minify_html: true
hooks:
  - docs/hooks/translation_status.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haroya01/query-audit

nav:
  - Home: index.md
  - Start Here:
    - Install in Your Project: getting-started/installation.md
    - Spring Boot Setup: getting-started/spring-boot.md
    - Run the Example: getting-started/quickstart.md
    - Coming from QuickPerf: guide/coming-from-quickperf.md
    - Versions and Compatibility: getting-started/versions.md
  - Guides:
    - Find an N+1:
      - How N+1 Detection Works: detections/n-plus-one.md
      - Read SQL and Call Sites: guide/reports.md
    - Lock the Fix:
      - Lock a Fixed Path: guide/choose-your-workflow.md
      - Query Contracts: guide/contracts.md
    - Gate the Pull Request:
      - Your First CI Check: guide/first-ci-check.md
      - Require Expected Tests: guide/audit-coverage.md
      - Advanced CI Recipes: guide/ci-cd.md
    - Troubleshooting: guide/troubleshooting.md
    - Limitations and Known Issues: guide/limitations.md
  - Reference:
    - Annotations: guide/annotations.md
    - Configuration: guide/configuration.md
    - Comparison Inputs: guide/comparison-inputs.md
    - Suppress a Finding: guide/suppressing.md
    - Custom Extensions: guide/extensions.md
    - Optional Rules:
      - Overview: detections/overview.md
      - Missing Index: detections/missing-index.md
      - SQL Anti-Patterns: detections/sql-anti-patterns.md
      - DML Anti-Patterns: detections/dml-anti-patterns.md
    - Background Reading: references.md
  - Extend and Contribute:
    - Architecture: architecture/overview.md
    - Extensible Runtime: architecture/extensible-runtime.md
    - Maintaining the Codebase: architecture/maintaining.md
    - Adding Database Support: architecture/new-database.md
    - Contributing: architecture/contributing.md
